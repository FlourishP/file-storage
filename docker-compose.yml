version: "3.9"
services:
  api:
    build: .
    ports:
      - "8006:8006"
    environment:
      - JWT_SECRET=change-me-in-production
      - MINIO_HOST=minio
      - MINIO_PORT=9000
    depends_on:
      - minio

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: changeme
    volumes:
      - minio-data:/data

volumes:
  minio-data: